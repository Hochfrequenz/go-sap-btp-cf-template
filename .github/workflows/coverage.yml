name: coverage
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  coverage:
    runs-on: ubuntu-latest
    env:
      # proxy.golang.org intermittently returned INTERNAL_ERROR during dependency resolution.
      # Keep a fallback mirror in the CI job so the coverage run is resilient to that outage.
      GOPROXY: https://proxy.golang.org,https://goproxy.io,direct
    steps:
      - name: Install Go
        if: success()
        uses: actions/setup-go@v7
        with:
          go-version: 1.27.x
      - name: Checkout Code
        uses: actions/checkout@v7
      - name: Calc coverage
        run: go test ./... -v -covermode=count -coverprofile=coverage.out
      - name: Convert coverage to lcov
        uses: jandelgado/gcov2lcov-action@v1.2.0
      - name: Enforce Min Coverage
        uses: VeryGoodOpenSource/very_good_coverage@v3.0.0
        with:
          path: "coverage.lcov"
          # The composition root (cmd/server/main.go — signal handling,
          # ListenAndServe, os.Exit paths) cannot be meaningfully unit
          # tested; exclude it so the 90 % gate reflects the library layer.
          exclude: "**/cmd/**"
          min_coverage: 90 # the plan is to increase this with time
