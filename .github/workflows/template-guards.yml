name: Template guards

# These gates exist because this repo is a template — every fork clones
# the current state, and a drift between the apply-config rewriter and
# the tree leaves downstream users with a half-renamed repo on first
# `go run ./cmd/apply-config`.
#
# Three guards:
#   1. apply-config smoke — copy the repo, run apply-config against a
#      fixture config.yml, then `go build ./... && go test ./...` in the
#      rewritten tree. Breaks if any rewriter stops matching its target.
#   2. magic-string gate — grep the tree for the template's module path
#      and `./cmd/server` outside their allow-listed homes. A new
#      hard-coded reference that the rewriter doesn't know about fails
#      CI, forcing the contributor to either extend the rewriter or
#      opt-out of the gate explicitly.
#   3. GOMEMLIMIT gate (runs in the magic-string job) — manifest.yml's
#      backend app must set a Go-syntax GOMEMLIMIT that is not `off`,
#      is at least 16MiB and is strictly below its memory: quota.

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:

  apply_config_smoke:
    name: apply-config smoke (fixture rewrite + build + test)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-go@v7
        with:
          go-version: 1.27.x

      - name: Copy repo to a scratch dir and inject a fresh config.yml
        run: |
          set -euxo pipefail
          WORK="$RUNNER_TEMP/apply-config-smoke"
          mkdir -p "$WORK"
          # rsync-style copy that skips the .git dir — the rewriter
          # must cope without git metadata.
          tar --exclude=.git -cf - . | tar -xf - -C "$WORK"
          cat > "$WORK/config.yml" <<'YAML'
          app:
            name: smoke-test-app
            module: github.com/example/smoke-test
          services:
            xsuaa:        smoke-xsuaa
            destination:  smoke-dest
            connectivity: smoke-cc
          cf:
            api:    https://api.cf.example-region.example.com
            org:    Example Org
            space:  smoke
            domain: cfapps.example-region.example.com
          YAML
          echo "WORK=$WORK" >> "$GITHUB_ENV"

      - name: Run apply-config against the scratch tree
        working-directory: ${{ env.WORK }}
        run: |
          set -euxo pipefail
          # Go needs to resolve the rewriter source relative to WORK,
          # which already includes cmd/apply-config. No --root needed.
          go run ./cmd/apply-config
          # Idempotency check: a second run must be a no-op.
          go run ./cmd/apply-config --check

      - name: Build + test the rewritten tree
        working-directory: ${{ env.WORK }}
        run: |
          set -euxo pipefail
          go build ./...
          go test ./...

      - name: Confirm the rewriter actually rewrote things
        working-directory: ${{ env.WORK }}
        run: |
          set -euxo pipefail
          # go.mod must carry the new module path.
          grep -q '^module github.com/example/smoke-test$' go.mod
          # manifest.yml must carry the new service names.
          grep -q -- '- smoke-xsuaa' manifest.yml
          grep -q -- '- smoke-dest'  manifest.yml
          grep -q -- '- smoke-cc'    manifest.yml
          # xs-security.json must carry the new xsappname.
          grep -q '"xsappname": "smoke-test-app"' xs-security.json
          # cmd/server/main.go must carry the rewritten OpenAPI title/
          # version call. The fixture config.yml above sets neither
          # app.title nor app.version, so title falls back to app.name
          # ("smoke-test-app") and version falls back to "0.0.0".
          grep -q 'huma.DefaultConfig("smoke-test-app", "0.0.0")' cmd/server/main.go
          # The old module path must NOT appear in any Go source in the
          # rewritten tree (outside cmd/apply-config which holds the
          # rewriter's internals and legitimately carries the original
          # module path as a test fixture).
          #
          # grep --exclude-dir matches directory *basenames*, not paths —
          # `--exclude-dir=apply-config` is what actually skips
          # cmd/apply-config/. Using the full path silently never
          # matches and the gate fires on every run.
          #
          # grep -r exits 2 (not 0/1) on an unreadable file or other
          # scan error, even if it already printed a real match — a
          # plain `if grep ...; then fail; fi` would let that silently
          # pass. scan_gate treats that the same as a violation.
          source "$GITHUB_WORKSPACE/.github/scripts/scan-gate.sh"
          scan_gate "stale module path survived apply-config" \
            grep -rn --include='*.go' --exclude-dir=apply-config \
            'github.com/hochfrequenz/go-sap-btp-cf-template' .

  magic_string_gate:
    name: magic-string gate (module path + ./cmd/server)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - name: Self-test scan_gate's own error handling
        run: |
          set -euo pipefail
          source "$GITHUB_WORKSPACE/.github/scripts/scan-gate.sh"
          # A scan tool that errors (here: exits 2, same as rg/grep -r on
          # an unreadable file) must make scan_gate fail, not pass.
          if scan_gate "self-test: should not be printed" sh -c 'exit 2'; then
            echo "::error::scan_gate self-test failed: it passed when the wrapped command exited 2 (tool error), instead of failing the gate." >&2
            exit 1
          fi
          echo "OK: scan_gate fails when the wrapped scan tool itself errors (exit 2)."

      - name: Install ripgrep
        run: sudo apt-get update && sudo apt-get install -y ripgrep

      - name: GOMEMLIMIT must be present, valid, and below the backend app's memory
        run: |
          set -euo pipefail
          # Select the BACKEND app by name — both apps declare
          # `memory: 128M`, so `name: ((backend-host))` is what
          # distinguishes it from the `((backend-host))-web` approuter.
          #
          # Guard the selector itself first: if a fork renamed or
          # duplicated the backend app, the yq queries below would
          # silently return nothing (or the wrong app), so require
          # exactly one match before reading GOMEMLIMIT off it.
          matches=$(yq eval '[.applications[] | select(.name == "((backend-host))")] | length' manifest.yml)
          if [ "$matches" != "1" ]; then
            echo "::error::manifest.yml must contain exactly one app named '((backend-host))' (found $matches); update this gate's selector if your fork renamed it." >&2
            exit 1
          fi

          gomemlimit=$(yq eval '.applications[] | select(.name == "((backend-host))") | .env.GOMEMLIMIT' manifest.yml)
          memory=$(yq eval '.applications[] | select(.name == "((backend-host))") | .memory' manifest.yml)

          if [ -z "$gomemlimit" ] || [ "$gomemlimit" = "null" ]; then
            echo "::error::manifest.yml backend app (((backend-host))) is missing GOMEMLIMIT in its env: block." >&2
            exit 1
          fi

          if [ "$gomemlimit" = "off" ]; then
            echo "::error::GOMEMLIMIT='off' disables the soft memory limit entirely; the Go runtime never reacts to container memory pressure. Set it to a byte value below memory: ($memory)." >&2
            exit 1
          fi

          # Go runtime GOMEMLIMIT format: decimal byte count with an
          # optional B/KiB/MiB/GiB/TiB suffix (see `go doc runtime`).
          # CF's own "M"/"MB"-style suffixes are NOT this format.
          if ! [[ "$gomemlimit" =~ ^[0-9]+(B|KiB|MiB|GiB|TiB)?$ ]]; then
            echo "::error::GOMEMLIMIT='$gomemlimit' is not a valid Go runtime GOMEMLIMIT value (decimal byte count with optional B/KiB/MiB/GiB/TiB suffix). A CF-style value like '100M' or '100MB' makes the Go runtime throw 'malformed GOMEMLIMIT' and the app crash-loops on deploy. See \`go doc runtime\`." >&2
            exit 1
          fi

          to_bytes() {
            local val="$1"
            [[ "$val" =~ ^([0-9]+)(B|KiB|MiB|GiB|TiB)?$ ]] || return 1
            local raw="${BASH_REMATCH[1]}" unit="${BASH_REMATCH[2]}" mult
            # Strip leading zeros, then parse base 10: bash reads a
            # leading-zero numeral (e.g. "08") as octal and aborts on 8/9.
            local digits="${raw#"${raw%%[!0]*}"}"
            # Go rejects anything that overflows int64 ("malformed
            # GOMEMLIMIT"); bash would silently wrap it, so refuse here.
            [ "${#digits}" -le 18 ] || return 1
            local num=$((10#${digits:-0}))
            case "$unit" in
              ""|B) mult=1 ;;
              KiB) mult=$((1024)) ;;
              MiB) mult=$((1024 ** 2)) ;;
              GiB) mult=$((1024 ** 3)) ;;
              TiB) mult=$((1024 ** 4)) ;;
            esac
            (( num <= 9223372036854775807 / mult )) || return 1
            echo $((num * mult))
          }

          if ! gomemlimit_bytes=$(to_bytes "$gomemlimit"); then
            echo "::error::GOMEMLIMIT='$gomemlimit' is too large (19+ significant digits or overflows int64); the Go runtime rejects overflowing values as 'malformed GOMEMLIMIT'." >&2
            exit 1
          fi

          sixteen_mib=$((16 * 1024 * 1024))
          if [ "$gomemlimit_bytes" -lt "$sixteen_mib" ]; then
            echo "::error::GOMEMLIMIT='$gomemlimit' ($gomemlimit_bytes bytes) is below 16MiB, which is too tight to be an intentional limit." >&2
            exit 1
          fi

          # CF manifest memory units: accept every unit CF's own docs
          # allow — M/G (and lowercase m/g), each with an optional
          # trailing "B"/"b" (MB, GB, mb, gb, ...). CF treats all of
          # these as MiB/GiB, never decimal MB/GB.
          if ! [[ "$memory" =~ ^([0-9]+)([MmGg])[Bb]?$ ]]; then
            echo "::error::manifest.yml backend app memory='$memory' is not in the expected CF format (a number followed by M/MB or G/GB, any case)." >&2
            exit 1
          fi
          # Base 10: same leading-zero-as-octal pitfall as GOMEMLIMIT above.
          mem_num=$((10#${BASH_REMATCH[1]}))
          mem_unit="${BASH_REMATCH[2]}"
          case "$mem_unit" in
            [Mm]) memory_bytes=$((mem_num * 1024 * 1024)) ;;
            [Gg]) memory_bytes=$((mem_num * 1024 * 1024 * 1024)) ;;
          esac

          if [ "$gomemlimit_bytes" -ge "$memory_bytes" ]; then
            echo "::error::GOMEMLIMIT='$gomemlimit' ($gomemlimit_bytes bytes) is not below manifest.yml's memory: $memory ($memory_bytes bytes). Lower GOMEMLIMIT, or raise memory: too and keep it in step (roughly the same ~80% ratio, see README)." >&2
            exit 1
          fi

          echo "OK: GOMEMLIMIT=$gomemlimit ($gomemlimit_bytes bytes) is valid and below memory: $memory ($memory_bytes bytes)."

      - name: Module path must only appear in rewriter-known files
        run: |
          set -euo pipefail
          # Allow-listed locations. Anywhere else, the grep fails the gate:
          #   - go.mod / go.sum           : rewriter handles these.
          #   - *.go                      : rewriter handles Go imports.
          #   - cmd/apply-config/         : rewriter source; holds the
          #                                 literal as the "from" value.
          #   - config.yml                : source of truth read by the
          #                                 rewriter (not output).
          #   - README.md / docs/         : prose about this template.
          #   - template-guards.yml       : this very workflow; quotes
          #                                 the literal in its rg call.
          #
          # Note: --no-ignore-vcs disables .gitignore-driven skipping so
          # .github/ and other dotfiles are scanned; we re-exclude
          # vendor / node_modules explicitly below.
          #
          # rg exits 2 (not 0/1) on an unreadable file or other scan
          # error, even if it already printed a real match — a plain
          # `if rg ...; then fail; fi` would let that silently pass.
          # scan_gate treats that the same as a violation.
          source "$GITHUB_WORKSPACE/.github/scripts/scan-gate.sh"
          scan_gate "The template module path appeared outside the allow-listed files above.
          ::error::Either add it to cmd/apply-config so apply-config rewrites the new file, or expand the allow-list in .github/workflows/template-guards.yml." \
            rg -n --hidden --no-ignore-vcs \
              --glob '!go.mod' --glob '!go.sum' \
              --glob '!*.go' \
              --glob '!cmd/apply-config/**' \
              --glob '!config.yml' \
              --glob '!README.md' --glob '!docs/**' \
              --glob '!.github/workflows/template-guards.yml' \
              --glob '!.git/**' \
              --glob '!vendor/**' --glob '!node_modules/**' \
              'github\.com/hochfrequenz/go-sap-btp-cf-template' .

      - name: No .Warn( log calls — template policy is INFO or DEBUG
        run: |
          set -euo pipefail
          # This repo follows Dave Cheney's two-levels discipline
          # (https://dave.cheney.net/2015/11/05/lets-talk-about-logging):
          # INFO for useful operational output, DEBUG for developer-
          # only context. No WARN — either it's an error and gets
          # returned, or it's information and gets logged as INFO.
          #
          # Scanning the production tree only (internal/, cmd/,
          # examples/). README and docs/ are not scanned because prose
          # legitimately discusses .Warn when explaining the policy.
          # rg exits 2 (not 0/1) on an unreadable file or other scan
          # error, even if it already printed a real match — a plain
          # `if rg ...; then fail; fi` would let that silently pass.
          # scan_gate treats that the same as a violation.
          source "$GITHUB_WORKSPACE/.github/scripts/scan-gate.sh"
          scan_gate "This repo does not use .Warn(). Elevate to a returned error, or demote to INFO/DEBUG. See README §'Logging — two levels, no warnings'." \
            rg -n --hidden --no-ignore-vcs \
              --glob 'internal/**' --glob 'cmd/**' --glob 'examples/**' \
              '\.Warn\(' .

      - name: Handlers must depend on btpingo interfaces, not *btpingo.Service
        run: |
          set -euo pipefail
          # Post-extraction (#130): handlers and wiring should only
          # reach into btpingo through its interfaces (OnPremCaller,
          # OnPremMutator, JWTValidator) — never through the concrete
          # *btpingo.Service. An exception is cmd/server/main.go's
          # construction seam, where main() calls btpingo.NewService and
          # then hands svc into buildRouter as OnPremCaller / OnPremMutator.
          # No other file should mention *btpingo.Service.
          #
          # The allow-list below scopes the match to handler-ish
          # locations; *btpingo.Service in cmd/server/main.go is allowed
          # (construction only), but not in
          # examples/ or in other cmd/* dirs.
          # rg exits 2 (not 0/1) on an unreadable file or other scan
          # error, even if it already printed a real match — a plain
          # `if rg ...; then fail; fi` would let that silently pass.
          # scan_gate treats that the same as a violation. The former
          # `2>/dev/null` on this rg call is gone: it hid rg's own
          # error message on exit 2, so a broken gate here (e.g. if
          # examples/ or cmd/ were ever removed or renamed) produced
          # no output at all in the run log.
          source "$GITHUB_WORKSPACE/.github/scripts/scan-gate.sh"
          scan_gate "Handlers/wiring must depend on btpingo interfaces (OnPremCaller / OnPremMutator / JWTValidator), not *btpingo.Service directly. See https://pkg.go.dev/github.com/hochfrequenz/btpingo for the library-intent surface (doc.go)." \
            rg -n --hidden --no-ignore-vcs \
              --glob '!cmd/server/main.go' \
              --glob '!.git/**' \
              --glob '!vendor/**' --glob '!node_modules/**' \
              '\*btpingo\.Service\b' examples cmd

      - name: xs-security.json redirect-uris must stay empty in the repo
        run: |
          set -euo pipefail
          # README §"5a Update XSUAA redirect URIs" tells the deployer to
          # edit redirect-uris locally, run `cf update-service go-xsuaa
          # -c xs-security.json`, and then `git restore xs-security.json`
          # so the deploy-specific URL never lands in a commit.
          # `redirect-uris` lives inside the XSUAA service-instance, not
          # in the repo's snapshot of xs-security.json — by convention
          # the file in the repo stays `[]`, one edit per deploy, never
          # committed.
          #
          # This gate catches the "forgot to restore" mistake. Without
          # it, a single tainted commit would silently propagate a
          # deploy-specific URL into every downstream fork's starting
          # state.
          count=$(jq '."oauth2-configuration"."redirect-uris" | length' xs-security.json)
          if [ "$count" -ne 0 ]; then
            echo "::error::xs-security.json has $count redirect-uris committed; expected []." >&2
            echo "::error::Fix: git restore xs-security.json (then re-run cf update-service if needed)." >&2
            echo "::error::See README §'5a Update XSUAA redirect URIs' for the full edit-then-restore lifecycle." >&2
            exit 1
          fi

      - name: CLAUDE.md must exist at repo root
        run: |
          set -euo pipefail
          # CLAUDE.md is the project's AI-orientation entry point —
          # rules + pointers an AI assistant reads on every prompt to
          # stay on-rails. Forks that strip it lose the safety net for
          # AI-assisted handler authoring (especially relevant where
          # the fork-author leans on AI to bridge a Go-fluency gap).
          # Bit-rot prevention same shape as the manual-fork-chores
          # gate below — file disappears, CI fires.
          if [ ! -f CLAUDE.md ]; then
            echo "::error::CLAUDE.md missing from repo root." >&2
            echo "::error::This file is the project's AI-orientation entry point — see README §'Using this repo as a template'." >&2
            exit 1
          fi

      - name: README "manual fork chores" rg patterns must each match >0
        run: |
          set -euo pipefail
          # The README §"Not rewritten — manual fork chores" subsection
          # documents specific rg commands a fork-author can run to
          # find HF-specific literals that survive apply-config. If
          # any of those patterns stops matching on the upstream tree
          # (because the file was renamed, the literal was changed,
          # or the row went stale), this gate fires so the doc is
          # updated alongside the change.
          fail=0
          while IFS='|' read -r label cmd; do
            [ -z "$label" ] && continue
            if ! eval "$cmd"; then
              echo "::error::README 'Not rewritten — manual fork chores' row '$label' is stale: \`$cmd\` returned 0 hits." >&2
              echo "::error::Either restore the literal, or remove the row from the table in README.md and update this workflow's pattern list." >&2
              fail=1
            fi
          done <<'PATTERNS'
          LICENSE Hochfrequenz copyright|rg --quiet Hochfrequenz LICENSE
          CODEOWNERS Hochfrequenz team|rg --quiet Hochfrequenz .github/CODEOWNERS
          Demo routes|rg --quiet '^\s*(adtdiscovery|adtcheckrun)\.Register\(' cmd/server/main.go
          PATTERNS
          if [ "$fail" -ne 0 ]; then
            exit 1
          fi

      - name: Hard-coded ./cmd/server must only appear in the known set
        run: |
          set -euo pipefail
          # Allow-listed locations for the literal './cmd/server':
          #   - manifest.yml            : declares the launch binary
          #   - Procfile                : same fallback
          #   - Makefile                : build recipe
          #   - scripts/                : build recipe
          #   - .github/workflows/      : CD step builds it
          #   - README.md               : walkthrough + escape-hatch docs
          #   - docs/                   : walkthrough prose
          #   - cmd/apply-config/       : mentioned in rewriter comments
          #   - cmd/server/             : the package itself — comments
          #                               legitimately reference the run
          #                               command in LOG_LEVEL / buildUA
          #                               examples. This directory cannot
          #                               meaningfully drift from the name.
          # rg exits 2 (not 0/1) on an unreadable file or other scan
          # error, even if it already printed a real match — a plain
          # `if rg ...; then fail; fi` would let that silently pass.
          # scan_gate treats that the same as a violation.
          source "$GITHUB_WORKSPACE/.github/scripts/scan-gate.sh"
          scan_gate "Hard-coded './cmd/server' appeared outside the allow-listed files above.
          ::error::Rename it to reference \$APP_NAME (or similar), or expand the allow-list in .github/workflows/template-guards.yml." \
            rg -n --hidden --no-ignore-vcs \
              --glob '!manifest.yml' \
              --glob '!Procfile' \
              --glob '!Makefile' \
              --glob '!scripts/**' \
              --glob '!.github/workflows/**' \
              --glob '!README.md' --glob '!docs/**' \
              --glob '!cmd/apply-config/**' \
              --glob '!cmd/server/**' \
              --glob '!.git/**' \
              --glob '!vendor/**' --glob '!node_modules/**' \
              '\./cmd/server' .
