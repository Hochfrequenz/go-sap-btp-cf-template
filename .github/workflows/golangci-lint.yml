name: golangci-lint
on:
  pull_request:
permissions:
  contents: read
jobs:
  golangci:
    runs-on: ubuntu-latest
    name: lint
    env:
      # Force the linter to build/run under the same Go toolchain the repo targets.
      # Without this, golangci-lint can end up built with a lower toolchain and fail
      # to load a module targeting go 1.27.0.
      GOTOOLCHAIN: go1.27.0
    steps:
      - name: Install Go
        uses: actions/setup-go@v7
        with:
          go-version: "1.27.x"
      - uses: actions/checkout@v7
      - name: golangci-lint
        uses: golangci/golangci-lint-action@v9
        with:
          version: v2.13.2
      - name: fmt
        run: golangci-lint fmt --diff
        
